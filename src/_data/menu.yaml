# La barre de navigation en haut des pages.
# Une entrée avec « url » est un lien direct ; une entrée avec « colonnes » est un menu déroulant.
# Le logo « İzmir by Night », à gauche, ramène à l'accueil (/).
# Rangée pour une campagne en cours, de gauche à droite :
#   Izmir      : tout ce qu'on consulte en jouant (carte, personnages, chronologie, wiki)
#   Rencontres : les pages d'ambiance, les plus visitées
#   Galerie    : en lien direct
#   Jouer      : la table et le système, puis ce qui servait avant la campagne (un lien par sujet)
# Le Journal (/ambiance/journal/) n'est pas dans le menu tant qu'il est vide : pour le remettre,
# ajoute « - texte: Journal » et « url: /ambiance/journal/ » dans la colonne de ton choix.

- titre: Izmir
  colonnes:
    - titre: Explorer
      liens:
        - texte: Carte
          url: /univers/map/
        - texte: Personnages
          url: /personnages/
        - texte: Relations
          url: /outils/relations/
        - texte: Chronologie
          url: /univers/chronologie/
    - titre: Savoir
