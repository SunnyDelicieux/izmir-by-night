# La barre de navigation en haut des pages.
# Une entrée avec « url » est un lien direct ; une entrée avec « colonnes » est un menu déroulant.
# Rangée par ordre d'importance, de gauche à droite (et dans chaque menu, les colonnes aussi) :
#   Ambiance : les rencontres (les pages les plus visitées), le journal, le tarot
#   Galerie  : en lien direct
#   Univers  : les repères (chronologie, cartes), les personnages, puis les pages du wiki
#   Jouer    : le système et les séances, puis la création (moins utile maintenant)

