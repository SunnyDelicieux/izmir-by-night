# La carte d'Izmir : le deuxième niveau de la page Carte (src/univers/map.html).
# Tout ce qui s'y affiche est dans ce fichier : l'image de fond, les rencontres, les lieux et les zones.
#
# POUR TROUVER DES COORDONNÉES : dans Google Maps, clic droit sur l'endroit,
# puis clic sur les deux nombres en haut du petit menu.
# Le premier est « lat », le deuxième « lon ».

# L'image de fond.
image: /img/map-izmir.webp
bords:
  ouest: 26.674
  est: 27.428
  nord: 38.575
  sud: 38.250

# ─────────────────────────────────────────────────────────────────────────────
# LES RENCONTRES
# Les pages d'ambiance, toujours affichées en bas de la carte, en boutons.
# lat et lon sont facultatifs : s'ils sont renseignés, la rencontre apparaît
# également sur la carte.

rencontres:
  - nom: L'Elysium
    qui: Nebetta
    lien: /ambiance/elysium/
    icone: /img/wiki/autre/nebetta.png
    # lat: 38.4189
    # lon: 27.1287

  - nom: Les Archives
    qui: Atam
    lien: /ambiance/archives/
    icone: /img/wiki/autre/atam.png
    # lat: 38.4189
    # lon: 27.1287

  - nom: Chez Inga
    qui: Inga
    lien: /ambiance/inga/
    icone: /img/wiki/autre/inga.png
    # lat: 38.4189
    # lon: 27.1287

# ─────────────────────────────────────────────────────────────────────────────
# LES LIEUX
# Les points de la carte. Au survol (ou au toucher), un panneau s'ouvre.
# personnages : noms des fichiers des fiches, sans .html.
# Seulement les informations publiques.

lieux:
  - nom: Tour Marmara
    lat: 38.4522
    lon: 27.1766
    texte: Le siège du groupe Marmara, et le coeur du domaine Arslan.
    personnages: [kerem]

  - nom: Université Égéenne
    lat: 38.4575
    lon: 27.2280
    texte: Domaine Tremere de 1955 à 2009. Depuis, le clan n'y garde qu'une zone d'influence.
    personnages: [eleni-paschalia, gabriel, serpent]

  - nom: Le port
    lat: 38.4450
    lon: 27.1495
    texte: Entrée et sortie de toute la marchandise de la ville, possédé par le Prince, co-géré par le primogénat.

  - nom: Konak
    lat: 38.4180
    lon: 27.1340
    texte: Le coeur du domaine Toreador.
    personnages: [nafissa]

  - nom: Ancien quartier arménien
    lat: 38.4250
    lon: 27.1440
    texte: L'église Saint-Stepannos, cœur du quartier et domaine Nosferatu, a brûlé avec lui en 1922.
    personnages: [atam]

  - nom: Whisper
    lat: 38.45411
    lon: 27.11336
    texte: Boite de nuit Brujah.
    personnages: [aaron]

  - nom: Clinique
    lat: 38.46532
    lon: 27.22035
    texte: Domaine Tremere.
    personnages: [esen]

  - nom: Manoir Enry
    lat: 38.49409
    lon: 27.10118
    texte: Manoir Enry.
    personnages: [henri]

  - nom: Hôtel des Primogènes
    lat: 38.39368
    lon: 27.03282
    texte: Le lieu de réunion connu des primogènes.
    personnages: [henri]

  - nom: Wayfarer Holding
    lat: 38.39848
    lon: 27.07651
    texte: Le siège social du groupe Wayfarer.
    personnages: [mariko, aaron, dimitri, alejandro]

  - nom: Bureau du sheriff
    lat: 38.46735
    lon: 27.12874
    texte: Bureau du sheriff.
    personnages: [baran]

  - nom: Jardin de Soteria
    lat: 38.41156
    lon: 27.20226
    texte: Jardin de Soteria.
    personnages: [maliha, aylin, calliope]

  - nom: Elysium
    lat: 38.41886
    lon: 27.12866
    texte: Elysium permanent de Nebetta.
    personnages: [nebetta, louisa, sophia]

