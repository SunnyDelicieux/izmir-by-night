    personnages: [eleni, gabriel, serpent]

  - nom: Le port
    lat: 38.4450
    lon: 27.1495
    texte: Entrée et sortie de toute la marchandise de la ville, possédé par le Prince, co-géré par le primogénat.

  - nom: Konak
    lat: 38.4180
    lon: 27.1340
    texte: Le coeur du domaine Torador.
    personnages: [nafissa]

  - nom: Ancien quartier arménien
    lat: 38.4250
    lon: 27.1440
    texte: L'église Saint-Stepannos, cœur du quartier et domaine Nosferatu, a brûlé avec lui en 1922.
    personnages: [atam]

  - nom: Whisper
    lat: 38.45411
    lon: 27.11336
    texte: Boite de nuit Brujah.
    personnages: [aaron]

  - nom: Clinique
    lat: 38.46532,
    lon: 27.22035
    texte: Domaine Tremere.
    personnages: [esen]

  - nom: Manoir Enry
    lat: 38.49409,
    lon: 27.10118
    texte: Manoir Enry.
    personnages: [enry]

  - nom: Hotel primogènes
    lat: 38.39368,
    lon: 27.03282
    texte: Le lieu de réunion connu des primogènes.
    personnages: [enry]

  - nom: Wayfarer Holding
    lat: 38.39848,
    lon: 27.07651
    texte: Le siège sociale du groupe Wayfarer.
    personnages: [mariko, aaron, dimitri, alejandro]

  - nom: Bureau du sheriff
    lat: 38.46735,
    lon: 27.12874
    texte: Bureau du sheriff.
    personnages: [baran]

  - nom: Jardin de Soteria
    lat: 38.41156,
    lon: 27.20226
    texte: Jardin de Soteria.
    personnages: [maliha, aylin, calliope]

 - nom: Elysium
    lat: 38.41886,
    lon: 27.12866
    texte: Elysium permanent de Nebetta.
    personnages: [nebetta, louiza, sophia]


# ───────────────────────────────────────────────────────────────────────────────────────────────
# LES ZONES D'INFLUENCE : des formes colorées sur la carte, avec leur légende en dessous.
#   nom : le nom de la zone
#   qui : à qui elle est (affiché dans la légende)
#   couleur : sa couleur (ex. "#b3423a" ; garde les guillemets)
#   lien : (facultatif) la page du site qui en parle
#   points : le contour de la zone, un point par ligne : [lat, lon]. Il faut au moins 3 points,
#            dans l'ordre où on ferait le tour de la zone. Pas besoin de répéter le premier à la fin.
# Celles de départ viennent du wiki ; leur contour est approximatif, à redessiner.
zones:
