# La carte d'Izmir : le deuxième niveau de la page Carte (src/univers/map.html), quand on entre dans la ville.
# Tout ce qui s'y affiche est dans ce fichier : l'image de fond, les rencontres, les lieux et les zones.
#
# POUR TROUVER DES COORDONNÉES : dans Google Maps, clic droit sur l'endroit, puis clic sur les deux nombres
# en haut du petit menu (ex. « 38.4189, 27.1287 ») : ils sont copiés. Le premier est « lat », le deuxième « lon ».

# L'image de fond. Enregistre ta capture Google Maps sous src/img/map-izmir.webp (le nord en haut).
# Les bords ci-dessous sont calés sur TA capture (celle avec l'aéroport, Gaziemir, Urla, Bornova).
# Si tout est un peu décalé après tes premiers points, ajuste ces 4 nombres (pas les points).
image: /img/map-izmir.webp
bords:
  ouest: 26.68
  est: 27.41
  nord: 38.58
  sud: 38.23

# ───────────────────────────────────────────────────────────────────────────────────────────────
# LES RENCONTRES : les pages d'ambiance. Elles sont toujours en bas de la carte, en boutons.
#   nom, qui : le lieu et le personnage qu'on y rencontre
#   lien : la page d'ambiance
#   icone : la petite image ronde
#   lat, lon : (facultatif) si tu les ajoutes, la rencontre apparaît AUSSI sur la carte, à cet endroit.
#              Elles n'y sont pas encore : enlève le « # » devant lat et lon et mets les vraies coordonnées.
rencontres:
  - nom: L'Elysium
    qui: Nebetta
    lien: /ambiance/elysium/
    icone: /img/wiki/autre/nebetta.png
    # lat: 38.4189
    # lon: 27.1287

  - nom: Les Archives
    qui: Atam
    lien: /ambiance/archives/
    icone: /img/wiki/autre/atam.png
    # lat: 38.4189
    # lon: 27.1287

  - nom: Chez Inga
    qui: Inga
    lien: /ambiance/inga/
    icone: /img/wiki/autre/inga.png
    # lat: 38.4189
    # lon: 27.1287

# ───────────────────────────────────────────────────────────────────────────────────────────────
# LES LIEUX : les points de la carte. Au survol (ou au toucher), un panneau s'ouvre.
#   nom : le nom du lieu
#   lat, lon : ses coordonnées
#   texte : (facultatif) une phrase ou deux
#   lien, lien_texte : (facultatif) la page du site qui en parle, et le texte du lien
#   personnages : (facultatif) qui on y croise : les noms des fichiers des fiches, sans .html (comme dans origines.yaml)
# Seulement ce qui est public ! Ceux de départ viennent tous de pages du wiki ; leur position est approximative.
lieux:
  - nom: Tour Marmara
    lat: 38.4522
    lon: 27.1766
    texte: Le siège du groupe Marmara, et le coeur du domaine Arslan.
    personnages: [kerem]

  - nom: Université Égéenne
    lat: 38.4575
    lon: 27.2280
