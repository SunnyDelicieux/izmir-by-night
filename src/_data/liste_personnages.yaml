# La page « Tous les personnages » (/personnages/) : ses sections, ses groupes et ses cartes, dans l'ordre.
# Une carte peut avoir :
#   fiche : le nom du fichier de la fiche (src/personnages/<fiche>.html), sans .html.
#           Le nom, l'icône et le lien viennent alors de la fiche. Si la fiche n'existe pas, le site refuse de se construire.
#   nom, icone : pour un personnage sans fiche, ou pour afficher autre chose que la fiche
#   role : la ligne sous le nom ; note : une deuxième ligne

