<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<title>nouveau dossier (2)</title>
	<style>
		body {
			margin: 0;
			padding: 14px;
			font: 12px monospace;
			color: #222;
			background: white;
		}

		.chemin {
			color: #848484;
			margin-bottom: 14px;
		}

		.fichier {
			display: inline-block;
			width: 90px;
			padding: 6px;
			text-align: center;
			border: 1px dashed transparent;
			border-radius: 6px;
			cursor: pointer;
			color: #222;
			text-decoration: none;
		}

		.fichier:hover {
			background: #0000000d;
			border-color: black;
		}

		/* l'icône : une feuille avec une bande rouge « PDF » */
		.icone-pdf {
			display: block;
			width: 38px;
			height: 48px;
			margin: 0 auto 6px;
			background: white;
			border: 1px solid #999;
			position: relative;
		}

		.icone-pdf::after {
			content: "PDF";
			position: absolute;
			left: -4px;
			right: -4px;
			bottom: 8px;
			background: #c00000;
			color: white;
			font: bold 10px Arial, sans-serif;
			padding: 2px 0;
		}
	</style>
</head>
<body>

<!-- LE DOSSIER CACHÉ du PC 1 : il est sous la petite fenêtre des mots de passe du bureau (index.html).
     Il ne contient qu'un PDF, qui s'ouvre dans une fenêtre du faux PC.
     Le PDF va dans src/ambiance/factions/cache/ ; si son nom change, change data-url et le texte ci-dessous. -->

<div class="chemin">C:\Users\Inga\Bureau\nouveau dossier (2)\</div>

<a class="fichier" data-url="cache/document.pdf" data-title="document.pdf">
	<span class="icone-pdf"></span>
	document.pdf
</a>

<script>
// le PDF s'ouvre dans une nouvelle fenêtre du bureau (ouvrirFenetre, dans index.html)
document.querySelector(".fichier").addEventListener("click", (e) => {
	e.preventDefault();
	const fichier = e.currentTarget;
	parent.ouvrirFenetre(fichier.dataset.url, fichier.dataset.title, 640, 560);
});
</script>

</body>
</html>
