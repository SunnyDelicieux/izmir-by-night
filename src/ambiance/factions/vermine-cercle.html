<!DOCTYPE html>
<html lang="fr">
<head>
<link rel="icon" type="image/png" href="/img/wiki/icon/logo-128.png">
<meta charset="UTF-8">
<title>◈</title>

<!--
    vermine.exe, la face cachée : l'espace des membres du culte (des Setites).
    Une voix parle au visiteur, lui pose des questions et retourne chacune de ses réponses
    en « chaîne à briser ». C'est la façon de penser des Setites : ne jamais forcer,
    seulement offrir ; tout ce qui te retient est une chaîne ; Set est le libérateur.
    La conversation est écrite dans « conversation », en bas : les textes se changent là.
-->

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    height: 100%;
}

body {
    display: flex;
    flex-direction: column;
    background: radial-gradient(ellipse at 50% 0%, #10241c, #050a08 70%);
    color: #d8ccb0;
    font: 16px/1.6 Georgia, "Times New Roman", serif;
    overflow: hidden;
}

/* l'en-tête : le serpent et le nom du lieu */
header {
    flex: none;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 18px;
    border-bottom: 1px solid #3a3320;
    letter-spacing: 4px;
    font-size: 12px;
    color: #a8925a;
    text-transform: uppercase;
}

header svg {
    width: 34px;
    height: 34px;
}

header .retour {
    margin-left: auto;
    color: #5d5440;
    text-decoration: none;
    letter-spacing: 1px;
    text-transform: none;
}

header .retour:hover { color: #a8925a; }

/* la conversation */
#fil {
    flex: 1;
    overflow-y: auto;
    padding: 20px 22px 10px;
}

.ligne {
    max-width: 78%;
    margin: 0 0 12px;
    padding: 10px 14px;
    border-radius: 3px;
    animation: apparition .4s ease-out;
}

.ligne.voix {
    background: rgba(168, 146, 90, .08);
    border-left: 2px solid #a8925a;
}

.ligne.toi {
    margin-left: auto;
    background: rgba(255, 255, 255, .04);
    border-right: 2px solid #5d5440;
    color: #9a927f;
    font-style: italic;
    text-align: right;
}

.ligne.revelation {
    max-width: 100%;
    background: none;
    border: none;
    color: #e3c46a;
    font-size: 19px;
    text-align: center;
    text-shadow: 0 0 14px rgba(227, 196, 106, .45);
}

@keyframes apparition {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
}

#ecrit {
    height: 20px;
    padding: 0 22px;
    color: #5d5440;
    font-size: 13px;
    font-style: italic;
}

/* les réponses possibles */
#choix {
    flex: none;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    min-height: 62px;
    padding: 12px 18px 16px;
    border-top: 1px solid #3a3320;
}

#choix button {
    padding: 8px 14px;
    background: transparent;
    border: 1px solid #5d5440;
    border-radius: 2px;
    color: #d8ccb0;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
    transition: .2s;
}

#choix button:hover,
#choix button:focus-visible {
    border-color: #e3c46a;
    color: #e3c46a;
    box-shadow: 0 0 10px rgba(227, 196, 106, .25);
}

#choix button .touche {
    color: #5d5440;
    margin-right: 6px;
}

/* l'œil qui s'ouvre à la fin */
#oeil {
    display: none;
    position: fixed;
    inset: 0;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 18px;
    background: #050a08;
    color: #a8925a;
    letter-spacing: 6px;
    font-size: 13px;
    text-transform: uppercase;
    animation: apparition 1.5s ease-out;
}

#oeil svg { width: 140px; }
</style>
</head>

<body>

<header>
    <!-- le serpent -->
    <svg viewBox="0 0 40 40" fill="none" stroke="#a8925a" stroke-width="2" stroke-linecap="round">
        <path d="M30 8 C 18 2, 6 10, 16 18 S 28 30, 12 34"/>
        <circle cx="31" cy="8.5" r="2.4" fill="#a8925a" stroke="none"/>
        <path d="M33 9 l 4 1 M33 9 l 3 3" stroke-width="1.2"/>
    </svg>
    <span>Le Cercle · ceux qui ont vu</span>
    <a class="retour" href="vermine.html">quitter</a>
</header>

<div id="fil"></div>
<div id="ecrit"></div>
<div id="choix"></div>

<div id="oeil">
    <svg viewBox="0 0 120 60" fill="none" stroke="#e3c46a" stroke-width="2">
        <path d="M4 30 Q 60 -8, 116 30 Q 60 68, 4 30 Z"/>
        <circle cx="60" cy="30" r="13" fill="#e3c46a" stroke="none"/>
        <ellipse cx="60" cy="30" rx="3" ry="11" fill="#050a08"/>
    </svg>
    <span id="oeil-texte"></span>
</div>


<script>
/* =========================
   LA CONVERSATION
   Chaque étape : ce que dit la voix (« dit », une ou plusieurs phrases),
   puis les réponses possibles (« choix »). Une réponse peut avoir :
     reponse : ce que la voix répond à ce choix
     chaine  : le nom de la chaîne qu'elle a trouvée chez toi (la dernière trouvée est gardée)
     fin     : "oui" ou "non", pour terminer la conversation
========================= */

const conversation = [
    {
        dit: [
            "Tu as trouvé la porte.",
            "Personne ne la trouve par hasard. On la trouve quand on est prêt à la chercher."
        ],
        choix: [
            { texte: "Je suis tombé dessus, c'est tout.", reponse: "Bien sûr. Comme tu « tombes » sur tout ce que tu désires sans oser le dire." },
            { texte: "Qui êtes-vous ?", reponse: "Ceux qui ont ouvert les yeux. Rien de plus. Rien de moins." },
            { texte: "C'est une secte, votre truc.", reponse: "Une secte te demande quelque chose. Nous, nous ne te demandons rien. Nous t'offrons." }
        ]
    },
    {
        dit: [
            "Dis-moi une chose. Une seule.",
            "Qu'est-ce qui te retient ?"
        ],
        choix: [
            { texte: "Ma famille.", chaine: "le sang", reponse: "Le sang. Ils t'aiment, oui, à condition que tu restes celui qu'ils ont décidé que tu serais. Ce n'est pas de l'amour : c'est une laisse brodée." },
            { texte: "Mon travail, l'argent.", chaine: "l'or", reponse: "L'or. Tu passes tes nuits à servir le jour d'un autre. Et tu appelles ça une vie." },
            { texte: "Mes principes.", chaine: "la loi", reponse: "La loi. Des règles écrites par des morts, pour que les vivants restent sages. Qui t'a appris qu'elles étaient à toi ?" },
            { texte: "La peur.", chaine: "la peur", reponse: "La peur. La plus honnête de toutes les chaînes : au moins, elle ne prétend pas t'aimer." }
        ]
    },
    {
        dit: [
            "Maintenant, ferme les yeux.",
            "Quand personne ne regarde, qu'est-ce que tu veux vraiment ?"
        ],
        choix: [
            { texte: "Du pouvoir.", reponse: "Alors cesse de t'en excuser. Ceux qui le possèdent ne se sont jamais excusés." },
            { texte: "Être aimé.", reponse: "Tu veux qu'on te voie tel que tu es. Ici, nous te voyons. Entièrement." },
            { texte: "Oublier.", reponse: "Nous avons de quoi faire taire ce qui crie en toi. Une nuit, ou pour toujours. C'est toi qui choisiras." },
            { texte: "Je ne sais pas.", reponse: "Si. Tu sais. Tu as seulement appris à ne pas l'entendre." }
        ]
    },
    {
        dit: [
            "Il y a très longtemps, un dieu régnait sous le soleil. Il voulait un monde immobile, ordonné, obéissant.",
            "Son frère, le dieu du désert et de la nuit, a refusé de s'agenouiller. Pour cela, on l'a appelé meurtrier, menteur, serpent.",
            "On l'a chassé. Mais il n'est jamais parti. Il attend dans l'ombre, et il libère ceux qui le cherchent.",
            "Il s'appelle Set."
        ],
        choix: [
            { texte: "Continue.", reponse: "Le soleil te montre ce qu'on te permet de voir. La nuit te montre ce qui est." },
            { texte: "Ce sont des contes.", reponse: "Tous les dieux sont des contes. Certains contes ont des dents." }
        ]
    },
    {
        dit: [
            "Nous ne te forcerons jamais. Personne ne t'a forcé à ouvrir cette page, ni à répondre.",
            "Chaque pas, c'est toi qui l'as fait. Il ne te reste qu'à le reconnaître.",
            "Veux-tu qu'on t'aide à briser ta chaîne ?"
        ],
        choix: [
            { texte: "Oui.", fin: "oui" },
            { texte: "Non.", fin: "non" }
        ]
    }
];

// les dernières phrases, selon la réponse finale ({chaine} est remplacé par la chaîne trouvée)
const fins = {
    oui: [
        "Alors c'est fait. Tu viens de choisir, et c'est le premier acte libre de ta vie.",
        "Ta chaîne s'appelle {chaine}. Jeudi, à la tombée de la nuit, quelqu'un viendra la dénouer avec toi."
    ],
    non: [
        "Bien sûr. Tu as le droit de refuser : c'est déjà une liberté que nous t'avons rendue.",
        "Mais maintenant, tu sais que la porte s'ouvre. Et ta chaîne, {chaine}, tu la sentiras chaque jour un peu plus."
    ]
};

// la chaîne gardée si le visiteur n'en a avoué aucune
let chaine = "le silence";


/* =========================
   LE FONCTIONNEMENT
========================= */

const fil = document.getElementById("fil");
const ecrit = document.getElementById("ecrit");
const zoneChoix = document.getElementById("choix");
const attendre = (ms) => new Promise((ok) => setTimeout(ok, ms));

function ajouter(texte, qui) {
    const ligne = document.createElement("p");
    ligne.className = "ligne " + qui;
    ligne.textContent = texte;
    fil.appendChild(ligne);
    fil.scrollTop = fil.scrollHeight;
}

// la voix « écrit » un moment avant chaque phrase, plus longtemps pour les longues
async function voixDit(phrases, qui = "voix") {
    for (const phrase of phrases) {
        ecrit.textContent = "quelqu'un écrit…";
        await attendre(500 + Math.min(phrase.length * 18, 1800));
        ecrit.textContent = "";
        ajouter(phrase.replace("{chaine}", "« " + chaine + " »"), qui);
    }
}

function proposer(choix) {
    return new Promise((ok) => {
        zoneChoix.innerHTML = "";
        choix.forEach((c, n) => {
            const bouton = document.createElement("button");
            bouton.type = "button";
            bouton.innerHTML = `<span class="touche">${n + 1}</span>`;
            bouton.append(c.texte);
            bouton.addEventListener("click", () => ok(c));
            zoneChoix.appendChild(bouton);
        });
        zoneChoix.querySelector("button")?.focus();
    });
}

// on peut aussi répondre avec les touches 1, 2, 3, 4
document.addEventListener("keydown", (e) => {
    const bouton = zoneChoix.querySelectorAll("button")[Number(e.key) - 1];
    if (bouton) bouton.click();
});

async function derouler() {
    await attendre(600);

    for (const etape of conversation) {
        await voixDit(etape.dit);
        const c = await proposer(etape.choix);
        zoneChoix.innerHTML = "";
        ajouter(c.texte, "toi");
        if (c.chaine) chaine = c.chaine;
        if (c.reponse) await voixDit([c.reponse]);

        if (c.fin) {
            await voixDit(fins[c.fin], "revelation");
            terminer(c.fin);
            return;
        }
    }
}

// la fin : l'œil s'ouvre, puis on est renvoyé sur la vitrine du site…
// où le livre d'or a un nouveau message (voir vermine.html)
async function terminer(fin) {
    try {
        sessionStorage.setItem("vermine-chaine", chaine);
        sessionStorage.setItem("vermine-fin", fin);
    } catch (e) {}

    await attendre(3500);
    document.getElementById("oeil-texte").textContent = fin === "oui" ? "Il t'a vu. Il t'attend." : "Il t'a vu.";
    document.getElementById("oeil").style.display = "flex";
    await attendre(4000);
    location.href = "vermine.html#livre";
}

derouler();
</script>

</body>
</html>
