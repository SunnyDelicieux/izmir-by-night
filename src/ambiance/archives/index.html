<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Les Archives de Smyrne</title>
	<link rel="icon" type="image/png" href="/img/wiki/icon/logo-128.png">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
	<link rel="stylesheet" href="archives.css">
	<style>
		body {
			display: flex;
			align-items: center;
			justify-content: center;
			height: 100vh;
			overflow: hidden;
		}

		/* LA SALLE : en 16/9, aussi grande que la fenêtre le permet.
		   Tout y est placé en % ; les tailles en « cqw » suivent sa largeur. */
		.salle {
			position: relative;
			width: min(100vw, 177.78vh);
			aspect-ratio: 16 / 9;
			overflow: hidden;
			container-type: inline-size;
		}

		.salle > * {
			position: absolute;
		}

		/* la lumière qui tombe du plafond, sur le mur */
		.lumiere {
			inset: 0;
			pointer-events: none;
			background: radial-gradient(ellipse 45% 60% at 55% 8%, rgba(255, 236, 200, 0.1), transparent 70%),
				radial-gradient(ellipse 80% 90% at 55% 30%, transparent 50%, rgba(0, 0, 0, 0.6));
		}

		/* le sol */
		.sol {
			left: 0;
			right: 0;
			top: 89%;
			bottom: 0;
			background: linear-gradient(#1b1714, #0b0908);
			border-top: 0.25cqw solid #2a241f;
		}

		/* LES TABLEAUX (sans cadre) */
		.tableau {
			padding: 0;
			background: none;
			border: none;
			cursor: pointer;
			filter: brightness(0.7);
			transition: transform 0.15s ease, filter 0.15s ease;
		}

		.tableau img {
			display: block;
			width: 100%;
			height: 100%;
			object-fit: cover;
		}

		/* LES CLASSEURS : posés sur le sol */
		.salle > .classeur {
			bottom: 11%;
			height: 52%;
			transform: translateX(-50%);
			filter: drop-shadow(0 0.8cqw 1cqw rgba(0, 0, 0, 0.8));
		}

		/* le nom du classeur, sur une fiche posée dessus */
		.salle > .classeur .nom {
			position: absolute;
			bottom: 100%;
			left: 50%;
			transform: translateX(-50%);
			padding: 0.4cqi 2cqi;
			white-space: nowrap;
			font: 500 5.4cqi var(--mono);
			color: #1c1a17;
			background: #cfc7b4;
		}

		/* L'ARMOIRE ET SES ÉTAGÈRES */
		.armoire {
			left: 74%;
			width: 22.4%;
			top: 14.3%;
			bottom: 9.3%;
			box-sizing: border-box;
			background: linear-gradient(#0e0b09, #16110d);
			border: 0.9cqw solid #2a1f17;
			box-shadow: inset 0 1.5cqw 2cqw rgba(0, 0, 0, 0.9), 0 1cqw 2cqw rgba(0, 0, 0, 0.8);
		}

		.planche {
			left: 74%;
			width: 22.4%;
			height: 1.1%;
			background: #2f2319;
			box-shadow: 0 0.4cqw 0.6cqw rgba(0, 0, 0, 0.7);
		}

		/* un objet posé sur une planche : son bas touche la planche */
		.objet {
			padding: 0;
			border: none;
			background: none;
			cursor: pointer;
			transform: translate(-50%, -100%);
			filter: brightness(0.75) drop-shadow(0 0.4cqw 0.5cqw rgba(0, 0, 0, 0.8));
			transition: transform 0.15s ease, filter 0.15s ease;
		}

		.objet img {
			display: block;
			height: 100%;
		}

		/* au survol, un objet ou un tableau grossit très légèrement et s'éclaire un peu */
		.objet:hover,
		.objet:focus-visible {
			transform: translate(-50%, -100%) scale(1.05);
			filter: brightness(0.95) drop-shadow(0 0.4cqw 0.5cqw rgba(0, 0, 0, 0.8));
			outline: none;
		}

		.tableau:hover,
		.tableau:focus-visible {
			transform: scale(1.02);
			filter: brightness(0.85);
			outline: none;
		}
	</style>
</head>
<body>

<!-- LA SALLE DES ARCHIVES.
     Les tableaux et les objets de l'étagère : un clic les montre en grand, avec leur texte (data-texte) dans la boîte de dialogue.
     Les classeurs : un clic sur un tiroir mène au classeur, vu de près (classeur.html).
     Ce que contiennent les classeurs est dans contenu.js. -->
<main class="salle mur" id="salle">
	<div class="sol"></div>

	<!-- les tableaux -->
	<button class="tableau" style="left: 3%; top: 7%; width: 11.5%; height: 28%" data-texte="test">
		<img src="img/femme-a-l-epee.webp" alt="Portrait d'une femme à l'épée">
	</button>
	<button class="tableau" style="left: 20%; top: 4.5%; width: 22%; height: 24.5%" data-texte="test">
		<img src="img/vue-de-smyrne.webp" alt="Vue de Smyrne">
	</button>

	<!-- l'armoire, ses planches, et les objets posés dessus (left, top : le bas de l'objet ; height : sa taille) -->
	<div class="armoire"></div>
	<div class="planche" style="top: 31.5%"></div>
	<div class="planche" style="top: 48.5%"></div>
	<div class="planche" style="top: 61.8%"></div>

	<button class="objet" style="left: 79.5%; top: 31.5%; height: 12%" data-texte="test"><img src="img/astrolabe.webp" alt="Un astrolabe"></button>
	<button class="objet" style="left: 90.5%; top: 31.5%; height: 14.5%" data-texte="test"><img src="img/statue-croissant.webp" alt="Une statuette au croissant de lune"></button>
	<button class="objet" style="left: 79.5%; top: 48.5%; height: 11%" data-texte="test"><img src="img/mosaique.webp" alt="Une mosaïque : un aigle et des serpents"></button>
	<button class="objet" style="left: 90.5%; top: 48.5%; height: 12%" data-texte="test"><img src="img/vase.webp" alt="Une jarre peinte"></button>
	<button class="objet" style="left: 79.5%; top: 61.8%; height: 11.5%" data-texte="test"><img src="img/statue-bronze.webp" alt="Une statuette de bronze"></button>
	<button class="objet" style="left: 90.5%; top: 61.8%; height: 11.5%" data-texte="test"><img src="img/aiguiere.webp" alt="Une aiguière"></button>

	<!-- les trois classeurs : le script plus bas les pose ici, d'après contenu.js -->

	<div class="lumiere"></div>
</main>

<script src="contenu.js"></script>
<script src="commun.js"></script>
<script>
	const salle = document.getElementById("salle");

	// les tableaux et les objets : leur texte dans la boîte de dialogue, et leur image en grand au-dessus
	salle.querySelectorAll("[data-texte]").forEach((el) => {
		el.onclick = () => dire(el.dataset.texte, el.querySelector("img")?.src);
	});

	// LES CLASSEURS, côte à côte, près de l'armoire.
	// Leur place : le milieu de chacun, en % de la largeur de la salle.
	const PLACES_CLASSEURS = [32, 47, 62];
	const lumiere = salle.querySelector(".lumiere");
	CLASSEURS.forEach((classeur, c) => {
		const meuble = document.createElement("div");
		meuble.style.left = PLACES_CLASSEURS[c] + "%";
		// un clic sur un tiroir : on va voir ce classeur de près, devant ce tiroir (sauf pour un classeur de décor)
		const aller = (t) => (location.href = `classeur.html?classeur=${c + 1}&tiroir=${t + 1}`);
		construireClasseur(meuble, classeur, classeur.decor ? null : aller);
		meuble.insertAdjacentHTML("beforeend", `<span class="nom">${echapper(classeur.nom)}</span>`);
		salle.insertBefore(meuble, lumiere);
	});
</script>

</body>
</html>
