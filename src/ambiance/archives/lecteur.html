<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>document</title>
	<style>
		html, body {
			margin: 0;
			background: #111;
			color-scheme: dark; /* une barre de défilement sombre */
		}

		/* les pages, l'une sous l'autre */
		#pages {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 16px;
			padding: 16px 0;
		}

		.page {
			position: relative;
			box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
		}

		.page canvas {
			display: block;
		}

		/* le texte du PDF, invisible mais sélectionnable, posé sur l'image */
		.textLayer {
			position: absolute;
			inset: 0;
			overflow: hidden;
			line-height: 1;
			text-size-adjust: none;
			transform-origin: 0 0;
		}

		.textLayer span,
		.textLayer br {
			color: transparent;
			position: absolute;
			white-space: pre;
			cursor: text;
			transform-origin: 0% 0%;
		}

		.textLayer ::selection {
			background: rgba(0, 0, 255, 0.3);
		}

		#message {
			color: #a8987f;
			font: italic 15px Georgia, serif;
			text-align: center;
			padding: 30px;
		}
	</style>
</head>
<body>

<!-- LE LECTEUR DE PDF DES ARCHIVES : toutes les pages, l'une sous l'autre, et le texte reste sélectionnable.
     Le PDF à ouvrir est dans l'adresse : lecteur.html?pdf=docs/mon-document.pdf
     Il utilise pdf.js (la bibliothèque de Mozilla qui lit les PDF), comme le lecteur du PC (factions/lecteur-pdf.html). -->
<p id="message">Ouverture du document…</p>
<div id="pages"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(async () => {
	const fichier = new URLSearchParams(location.search).get("pdf");
	const message = document.getElementById("message");
	try {
		pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
		const pdf = await pdfjsLib.getDocument(fichier).promise;
		message.remove();

		for (let numero = 1; numero <= pdf.numPages; numero++) {
			const page = await pdf.getPage(numero);
			// la page prend la largeur de la fenêtre (sans dépasser 900 pixels)
			const taille = page.getViewport({ scale: 1 });
			const echelle = Math.min(900, innerWidth - 32) / taille.width;
			const vue = page.getViewport({ scale: echelle });

			const bloc = document.createElement("div");
			bloc.className = "page";
			const canvas = document.createElement("canvas");
			const nettete = window.devicePixelRatio || 1; // assez fine pour les écrans très nets
			canvas.width = Math.floor(vue.width * nettete);
			canvas.height = Math.floor(vue.height * nettete);
			canvas.style.width = Math.floor(vue.width) + "px";
			canvas.style.height = Math.floor(vue.height) + "px";
			bloc.append(canvas);
			document.getElementById("pages").append(bloc);

			await page.render({
				canvasContext: canvas.getContext("2d"),
				viewport: vue,
				transform: [nettete, 0, 0, nettete, 0, 0],
			}).promise;

			// le texte par-dessus, pour pouvoir le sélectionner
			const texte = document.createElement("div");
			texte.className = "textLayer";
			texte.style.setProperty("--scale-factor", echelle);
			bloc.append(texte);
			await pdfjsLib.renderTextLayer({
				textContentSource: await page.getTextContent(),
				container: texte,
				viewport: vue,
			}).promise;
		}
	} catch (e) {
		message.textContent = "Impossible d'ouvrir ce document.";
	}
})();
</script>
</body>
</html>
